<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gerenciador de QR codes</title>
<style>
  :root { --bg:#f5f5f5; --card:#fff; --text:#222; --muted:#666; --border:#ccc; --accent:#2563eb; --danger:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --card:#222; --text:#eee; --muted:#aaa; --border:#444; --accent:#60a5fa; --danger:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; padding:1rem; }
  .wrap { max-width:860px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1rem; }
  h1 { font-size:1.4rem; margin:0; }
  h2 { font-size:1.05rem; margin:0 0 .75rem; }
  .card { background:var(--card); border-radius:12px; padding:1.1rem; box-shadow:0 2px 12px rgba(0,0,0,.1); margin-bottom:1rem; }
  label { display:block; font-weight:600; margin:.8rem 0 .25rem; font-size:.9rem; }
  input { width:100%; padding:.65rem; font-size:1rem; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); }
  input:disabled { opacity:.6; }
  .hint { color:var(--muted); font-size:.85rem; margin-top:.3rem; word-break:break-all; }
  button, .btn { font:inherit; font-weight:600; font-size:.9rem; padding:.55rem .9rem; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; text-decoration:none; display:inline-block; }
  button.sec, .btn.sec { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button.danger { background:transparent; color:var(--danger); border:1px solid var(--danger); }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:1rem; }
  .item { border-top:1px solid var(--border); padding:.9rem 0; }
  .item:first-child { border-top:0; }
  .id { font-weight:700; font-size:1.05rem; }
  .label { color:var(--muted); margin-left:.4rem; }
  .url { display:block; margin-top:.25rem; color:var(--accent); word-break:break-all; font-size:.9rem; }
  .empty { color:var(--muted); text-align:center; padding:1rem 0; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:.75rem; margin-bottom:.75rem; }
  .bar input { max-width:260px; }
  dialog { border:0; border-radius:12px; padding:1.2rem; background:var(--card); color:var(--text); max-width:340px; width:92%; text-align:center; }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  #qrbox svg { width:260px; max-width:100%; height:auto; border:1px solid var(--border); }
  #toast { position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); background:#111; color:#fff; padding:.6rem 1rem; border-radius:8px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90%; }
  #toast.show { opacity:1; }
  #toast.err { background:#b91c1c; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gerenciador de QR codes</h1>
    <form method="POST" action="/_/logout"><button class="sec" type="submit">Sair</button></form>
  </header>

  <section class="card">
    <h2 id="form-title">Nova placa</h2>
    <label for="f-id">Nome da placa (parte final do link)</label>
    <input id="f-id" type="text" placeholder="ex: mesa1" maxlength="60" autocomplete="off">
    <div class="hint" id="f-preview"></div>
    <label for="f-label">Descrição (opcional)</label>
    <input id="f-label" type="text" placeholder="ex: Cardápio da mesa 1" maxlength="60" autocomplete="off">
    <label for="f-url">Link de destino</label>
    <input id="f-url" type="text" inputmode="url" placeholder="https://..." autocomplete="off">
    <div class="row">
      <button id="f-save" type="button">Salvar</button>
      <button id="f-cancel" type="button" class="sec" hidden>Cancelar edição</button>
    </div>
  </section>

  <section class="card">
    <div class="bar">
      <h2 id="count" style="margin:0">Placas</h2>
      <input id="search" type="search" placeholder="Buscar...">
    </div>
    <div id="list"><div class="empty">Carregando...</div></div>
  </section>
</div>

<dialog id="qr-dialog">
  <h2 id="qr-title"></h2>
  <div id="qrbox"></div>
  <div class="hint" id="qr-link"></div>
  <div class="row" style="justify-content:center">
    <button id="qr-svg" type="button">Baixar SVG</button>
    <button id="qr-png" type="button">Baixar PNG</button>
    <button id="qr-copy" type="button" class="sec">Copiar link</button>
    <button id="qr-close" type="button" class="sec">Fechar</button>
  </div>
</dialog>
<div id="toast"></div>

<script src="/qrcode.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var items = [];
  var editing = false;
  var current = null;

  function toast(msg, isErr) {
    var t = $("#toast");
    t.textContent = msg;
    t.className = "show" + (isErr ? " err" : "");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.className = ""; }, 2800);
  }

  function api(path, body) {
    var opt = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {};
    return fetch(path, opt).then(function (res) {
      if (res.status === 401) { location.reload(); throw new Error("Sessão expirada"); }
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || "Erro inesperado");
        return data;
      });
    });
  }

  function el(tag, props, children) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === "text") e.textContent = props[k];
      else if (k === "class") e.className = props[k];
      else e.setAttribute(k, props[k]);
    });
    (children || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }

  function fullLink(id) { return location.origin + "/" + id; }

  function render() {
    var q = $("#search").value.trim().toLowerCase();
    var shown = items.filter(function (i) {
      return !q || (i.id + " " + i.label + " " + i.url).toLowerCase().indexOf(q) !== -1;
    });
    $("#count").textContent = items.length + (items.length === 1 ? " placa" : " placas");
    var list = $("#list");
    list.innerHTML = "";
    if (!shown.length) {
      list.appendChild(el("div", { "class": "empty", text: items.length ? "Nenhum resultado." : "Nenhuma placa programada ainda." }));
      return;
    }
    shown.forEach(function (i) {
      var title = el("div", {}, [el("span", { "class": "id", text: "/" + i.id })]);
      if (i.label) title.appendChild(el("span", { "class": "label", text: i.label }));
      var url = el("a", { "class": "url", href: i.url, target: "_blank", rel: "noopener noreferrer", text: i.url });

      var bQr = el("button", { type: "button", text: "QR code" });
      bQr.onclick = function () { openQr(i); };
      var bTest = el("a", { "class": "btn sec", href: "/" + i.id, target: "_blank", rel: "noopener", text: "Testar" });
      var bEdit = el("button", { type: "button", "class": "sec", text: "Editar" });
      bEdit.onclick = function () { startEdit(i); };
      var bDel = el("button", { type: "button", "class": "danger", text: "Apagar" });
      bDel.onclick = function () { removeItem(i); };

      list.appendChild(el("div", { "class": "item" }, [
        title, url,
        el("div", { "class": "row", style: "margin-top:.6rem" }, [bQr, bTest, bEdit, bDel])
      ]));
    });
  }

  function load() {
    return api("/_/api/list").then(function (d) { items = d.items || []; render(); })
      .catch(function (e) { $("#list").innerHTML = ""; $("#list").appendChild(el("div", { "class": "empty", text: e.message })); });
  }

  function updatePreview() {
    var v = $("#f-id").value.trim();
    $("#f-preview").textContent = v ? "Link do QR: " + fullLink(v) : "";
  }

  function resetForm() {
    editing = false;
    $("#form-title").textContent = "Nova placa";
    $("#f-id").value = ""; $("#f-id").disabled = false;
    $("#f-label").value = ""; $("#f-url").value = "";
    $("#f-cancel").hidden = true;
    updatePreview();
  }

  function startEdit(i) {
    editing = true;
    $("#form-title").textContent = "Editando /" + i.id;
    $("#f-id").value = i.id; $("#f-id").disabled = true;
    $("#f-label").value = i.label; $("#f-url").value = i.url;
    $("#f-cancel").hidden = false;
    updatePreview();
    window.scrollTo({ top: 0, behavior: "smooth" });
    $("#f-url").focus();
  }

  function save() {
    var id = $("#f-id").value.trim();
    var url = $("#f-url").value.trim();
    var label = $("#f-label").value.trim();
    if (!id || !url) { toast("Preencha o nome e o link de destino.", true); return; }
    if (!editing && items.some(function (i) { return i.id === id; })) {
      if (!confirm("/" + id + " já existe. Quer substituir o destino?")) return;
    }
    api("/_/api/save", { id: id, url: url, label: label })
      .then(function () { toast("Salvo!"); resetForm(); return load(); })
      .catch(function (e) { toast(e.message, true); });
  }

  function removeItem(i) {
    if (!confirm("Apagar a programação de /" + i.id + "?\nO QR vai voltar a pedir um destino no próximo acesso.")) return;
    api("/_/api/delete", { id: i.id })
      .then(function () { toast("Apagado."); if (editing && $("#f-id").value === i.id) resetForm(); return load(); })
      .catch(function (e) { toast(e.message, true); });
  }

  /* ---------- QR code ---------- */
  function makeQr(text) {
    var qr = qrcode(0, "Q");
    qr.addData(text);
    qr.make();
    return qr;
  }

  function qrSvg(qr, size) {
    var n = qr.getModuleCount(), m = 4, total = n + 2 * m, d = "";
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      if (qr.isDark(r, c)) d += "M" + (c + m) + " " + (r + m) + "h1v1h-1z";
    }
    var dim = size ? ' width="' + size + '" height="' + size + '"' : "";
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + total + " " + total + '"' + dim +
      ' shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  }

  function download(name, blob) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function openQr(i) {
    current = i;
    var link = fullLink(i.id);
    try {
      var qr = makeQr(link);
      $("#qrbox").innerHTML = qrSvg(qr);
    } catch (e) { toast("Não foi possível gerar o QR.", true); return; }
    $("#qr-title").textContent = "/" + i.id;
    $("#qr-link").textContent = link;
    $("#qr-dialog").showModal();
  }

  $("#qr-svg").onclick = function () {
    var qr = makeQr(fullLink(current.id));
    download("qr-" + current.id + ".svg", new Blob([qrSvg(qr, 1000)], { type: "image/svg+xml" }));
  };

  $("#qr-png").onclick = function () {
    var qr = makeQr(fullLink(current.id));
    var n = qr.getModuleCount(), m = 4, total = n + 2 * m;
    var scale = Math.max(1, Math.floor(1000 / total));
    var canvas = document.createElement("canvas");
    canvas.width = canvas.height = total * scale;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#000";
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      if (qr.isDark(r, c)) ctx.fillRect((c + m) * scale, (r + m) * scale, scale, scale);
    }
    canvas.toBlob(function (b) { download("qr-" + current.id + ".png", b); }, "image/png");
  };

  $("#qr-copy").onclick = function () {
    var link = fullLink(current.id);
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
      .then(function () { toast("Link copiado."); })
      .catch(function () { toast("Não foi possível copiar.", true); });
  };
  $("#qr-close").onclick = function () { $("#qr-dialog").close(); };

  /* ---------- eventos ---------- */
  $("#f-save").onclick = save;
  $("#f-cancel").onclick = resetForm;
  $("#f-id").oninput = updatePreview;
  $("#search").oninput = render;
  ["#f-id", "#f-label", "#f-url"].forEach(function (s) {
    $(s).addEventListener("keydown", function (e) { if (e.key === "Enter") save(); });
  });

  load();
})();
</script>
</body>
</html>
